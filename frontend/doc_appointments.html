    table, th, td { border: 1px solid #444; }

 async function getDoctorAppointments() {
  const doctorId = document.getElementById('doctorIdForAppointments').value;
  const res = await fetch(`${baseUrl}/doctors/${doctorId}/appointments`);
  const data = await res.json();
  const listDiv = document.getElementById('doctorAppointmentsList');
  listDiv.innerHTML = '';

  if (!data.success || data.data.length === 0) {
    listDiv.textContent = 'No appointments found for this doctor.';
    return;
  }

  // Create table in the same style as others
  const table = document.createElement('table');
  table.innerHTML = `<tr>
    <th>ID</th><th>Patient ID</th><th>Date</th><th>Time</th><th>Status</th><th>Patient Name</th>
  </tr>`;

  data.data.forEach(appt => {
    table.innerHTML += `<tr>
      <td>${appt[0]}</td>
      <td>${appt[1]}</td>
      <td>${appt[2].split('T')[0]}</td>
      <td>${appt[3]}</td>
      <td>${appt[4]}</td>
      <td>${appt[5]}</td>
    </tr>`;
  });

  listDiv.appendChild(table);
}

    async function getAppointmentById() {
  const id = document.getElementById('getApptId').value;
  const res = await fetch(`${baseUrl}/appointments/${id}`);
  const result = await res.json();

  if (result.success) {
    const a = result.data;
    document.getElementById('singleAppt').innerHTML = `
      <table border="1" style="width:100%; color:white; border-collapse: collapse;">
        <tr><th>ID</th><td>${a.APPOINTMENT_ID}</td></tr>
        <tr><th>Patient</th><td>${a.PATIENT_NAME} (ID: ${a.PATIENT_ID})</td></tr>
        <tr><th>Doctor</th><td>${a.DOCTOR_NAME} (ID: ${a.DOCTOR_ID})</td></tr>
        <tr><th>Date</th><td>${a.APPOINTMENT_DATE}</td></tr>
        <tr><th>Time</th><td>${a.APPOINTMENT_TIME}</td></tr>
        <tr><th>Status</th><td>${a.STATUS}</td></tr>
      </table>
    `;
  } else {
    document.getElementById('singleAppt').textContent = result.message;
  }
}

    async function getAllAppointments() {
  const res = await fetch(`${baseUrl}/appointments`);
  const result = await res.json(); // { success: true, data: [...] }

  const list = document.getElementById('appointmentsList');
  list.innerHTML = '';

  if (result.success && result.data.length > 0) {
    const table = document.createElement('table');
    table.style.width = '100%';
    table.style.borderCollapse = 'collapse';
    table.style.color = '#fff';

    // Table header
    const header = table.insertRow();
    ['ID', 'Patient', 'Doctor', 'Date', 'Time', 'Status'].forEach(h => {
      const th = document.createElement('th');
      th.textContent = h;
      th.style.border = '1px solid #555';
      th.style.padding = '8px';
      th.style.backgroundColor = '#008080';
      header.appendChild(th);
    });

    // Table rows
    result.data.forEach(a => {
      const row = table.insertRow();
      const patientInfo = `${a[6]} (ID: ${a[1]})`;
      const doctorInfo = `${a[8]} (ID: ${a[2]})`;
      [a[0], patientInfo, doctorInfo, new Date(a[3]).toLocaleDateString(), a[4], a[5]].forEach(text => {
        const cell = row.insertCell();
        cell.textContent = text;
        cell.style.border = '1px solid #555';
        cell.style.padding = '8px';
      });
    });

    list.appendChild(table);
  } else {
    list.textContent = 'No appointments found';
  }
}

async function updateAppointmentStatus() {
  const appointment_id = document.getElementById('updateApptId').value;
  const status = document.getElementById('updateApptStatus').value;

  if (!appointment_id || !status) {
    alert('Please enter Appointment ID and select a status.');
    return;
  }

  try {
    const res = await fetch(`${baseUrl}/appointments/${appointment_id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });

    if (res.ok) {
      alert('Appointment status updated successfully');
      closeModal('updateStatusModal');
      getAllAppointments(); // refresh list
    } else {
      const data = await res.json();
      alert('Failed to update status: ' + (data.message || 'Unknown error'));
    }
  } catch (err) {
    console.error(err);
    alert('Error connecting to server.');
  }
}
