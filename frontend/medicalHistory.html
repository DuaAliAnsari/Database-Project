<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical History</title>
  <style>
    body { background-color: #121212; color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; }
    header { display: flex; align-items: center; background-color: #1f1f1f; padding: 10px 20px; }
    header img { width: 50px; height: 50px; margin-right: 15px; }
    header h1 { margin: 0; }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px; width: 90%; max-width: 1200px; margin-left: auto; margin-right: auto; }
    button.action-btn { padding: 15px 40px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background-color: #00bfa5; color: #fff; transition: 0.2s; }
    button.action-btn:hover { background-color: #00a58f; }
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
    .modal-content {
      position: relative;
      background-color: #1f1f1f;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
      width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
    }
    .modal-content input, .modal-content textarea {
      width: 100%; padding: 8px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background-color: #2a2a2a; color: #f4f4f4;
    }
    .close-cross { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #ff4d4d; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; }
    th, td { border: 1px solid #333; padding: 8px; }
    th { background-color: #2a2a2a; }
    td { background-color: #1f1f1f; }
  </style>
</head>
<body>
  <header>
    <img src="https://tse1.mm.bing.net/th/id/OIP.y9Wm3U5yHBe2-nfaphxiPwHaHV?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo">
    <h1>Medical History</h1>
  </header>

  <main>
    <button class="action-btn" onclick="openModal('getModal')">Get Medical History By Patient ID</button>
    <!-- <button class="action-btn" onclick="openModal('deleteModal')">Delete Medical Histories</button> -->
    <button class="action-btn" onclick="openModal('addModal')">Add Medical History</button>
    <!-- <button class="action-btn" onclick="openModal('updateModal')">Update Medical History</button> -->
  </main>

  <!-- Add Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('addModal')">&times;</span>
      <h2>Add Medical History</h2>
      <input type="number" id="addPatientId" placeholder="Patient ID" required>
      <input type="text" id="addBloodGroup" placeholder="Blood Group">
      <input type="text" id="addAllergies" placeholder="Allergies">
      <input type="text" id="addSurgeries" placeholder="Surgeries">
      <input type="text" id="addVaccination" placeholder="Vaccination">
      <input type="text" id="addFamily" placeholder="Family History">
      <input type="text" id="addMedicalChecks" placeholder="Medical Checks">
      <button onclick="addHistory()">Add</button>
    </div>
  </div>

  <!-- Get Modal -->
  <div id="getModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('getModal')">&times;</span>
      <h2>Get Medical History By Patient ID</h2>
      <input type="number" id="getPatientId" placeholder="Patient ID">
      <button onclick="getHistoryByPatient()">Get</button>
      <div id="singleHistory"></div>
    </div>
  </div>

  <!-- Update Modal -->
  <div id="updateModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('updateModal')">&times;</span>
      <h2>Update Medical History</h2>
      <input type="number" id="updatePatientId" placeholder="Patient ID to update" required>
      <input type="text" id="updateBloodGroup" placeholder="Blood Group">
      <input type="text" id="updateAllergies" placeholder="Allergies">
      <input type="text" id="updateSurgeries" placeholder="Surgeries">
      <input type="text" id="updateVaccination" placeholder="Vaccination">
      <input type="text" id="updateFamily" placeholder="Family History">
      <input type="text" id="updateMedicalChecks" placeholder="Medical Checks">
      <button onclick="updateHistory()">Update</button>
    </div>
  </div>

  <!-- Medical History Table -->
  <div id="historyList"></div>

  <script>
    const baseUrl = 'http://localhost:3001/api';

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Add medical history
    async function addHistory() {
      const data = {
        patient_id: document.getElementById('addPatientId').value,
        blood_group: document.getElementById('addBloodGroup').value,
        allergies: document.getElementById('addAllergies').value,
        past_surgeries_operations: document.getElementById('addSurgeries').value,
        vaccination_history: document.getElementById('addVaccination').value,
        family_history: document.getElementById('addFamily').value,
        medical_checks: document.getElementById('addMedicalChecks').value
      };

      const res = await fetch(`${baseUrl}/medical-history`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      if(res.ok){
        alert('Medical history added!');
        closeModal('addModal');
        getAllHistory();
      } else {
        const d = await res.json();
        alert('Failed: ' + (d.message || 'Unknown error'));
      }
    }

    // Get medical history by patient
    async function getHistoryByPatient() {
  const patientId = document.getElementById('getPatientId').value;
  const res = await fetch(`${baseUrl}/medical-history/${patientId}`);
  const data = await res.json();
  const div = document.getElementById('singleHistory');
  div.innerHTML = '';

  if (res.ok) {
    div.innerHTML = `<table>
      <tr><th>Patient ID</th><td>${data.patient_id}</td></tr>
      <tr><th>Blood Group</th><td>${data.blood_group}</td></tr>
      <tr><th>Allergies</th><td>${data.allergies}</td></tr>
      <tr><th>Surgeries</th><td>${data.past_surgeries_operations}</td></tr>
      <tr><th>Vaccination</th><td>${data.vaccination_history}</td></tr>
      <tr><th>Family History</th><td>${data.family_history}</td></tr>
      <tr><th>Medical Checks</th><td>${data.medical_checks}</td></tr>
      <tr><td colspan="2"><button onclick="deleteHistory(${data.patient_id})">Delete</button></td></tr>
    </table>`;
  } else {
    div.textContent = data.message || 'No record found';
  }
}

    // Update medical history
    async function updateHistory() {
  const patientId = document.getElementById('updatePatientId').value;
  const data = {
    blood_group: document.getElementById('updateBloodGroup').value || null,
    allergies: document.getElementById('updateAllergies').value || null,
    past_surgeries_operations: document.getElementById('updateSurgeries').value || null,
    vaccination_history: document.getElementById('updateVaccination').value || null,
    family_history: document.getElementById('updateFamily').value || null,
    medical_checks: document.getElementById('updateMedicalChecks').value || null
  };

  const res = await fetch(`${baseUrl}/medical-history`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if(res.ok){
    alert('Medical history updated!');
    closeModal('updateModal');
    getAllHistory();
  } else {
    const d = await res.json();
    alert('Failed: ' + (d.message || 'Unknown error'));
  }
}


    // Delete medical history
    async function deleteHistory(patientId) {
      if(!confirm('Are you sure you want to delete this record?')) return;
      const res = await fetch(`${baseUrl}/medical-history/${patientId}`, { method: 'DELETE' });
      if(res.ok){ alert('Deleted'); getAllHistory(); }
      else { const d = await res.json(); alert('Failed: ' + (d.message || 'Unknown error')); }
    }


  </script>
</body>
</html>
