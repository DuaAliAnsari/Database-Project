<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Dashboard</title>

  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    header {
      background-color: #1f1f1f;
      padding: 15px 25px;
      display: flex;
      align-items: center;
    }

    header img {
      width: 50px;
      margin-right: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    main {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .action-btn {
      width: 320px;
      padding: 15px;
      background-color: #00bfa5;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      color: #fff;
      text-align: center;
      transition: background-color 0.2s;
    }

    .action-btn:hover {
      background-color: #009f8b;
    }
  </style>
</head>

<body>

<header>
  <img src="https://tse1.mm.bing.net/th/id/OIP.y9Wm3U5yHBe2-nfaphxiPwHaHV?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo">
  <h1>Doctor Dashboard</h1>
</header>

<main>
  <button class="action-btn" onclick="goTo('doc_appointments.html')">Manage Appointments</button>

  <button class="action-btn" onclick="goTo('doc_patients.html')">Manage Patients</button>

  <button class="action-btn" onclick="goTo('visitRecords.html')">Visit-Specific Records</button>

  <!-- <button class="action-btn" onclick="goTo('prescriptions.html')">Prescription</button> -->

  <button class="action-btn" onclick="goTo('medicalHistory.html')">Medical History</button>
</main>

<script>
  function goTo(page) {
    window.location.href = page;
  }
</script>

</body>
</html>
