<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Bills</title>
  <style>
    body { background-color: #121212; color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; }
    header {
      display: flex; align-items: center;
      background-color: #1f1f1f; padding: 10px 20px;
    }
    header img { width: 50px; height: 50px; margin-right: 15px; }
    header h1 { margin: 0; }
    main {
      display: flex; flex-direction: column;
      align-items: center; gap: 20px; margin-top: 50px;
    }
    button.action-btn {
      padding: 15px 40px; font-size: 18px;
      border: none; border-radius: 8px;
      cursor: pointer; background-color: #00bfa5; color: #fff;
    }
    button.action-btn:hover { background-color: #00a58f; }
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
    .modal-content {
      position: relative;
      background-color: #1f1f1f; margin: 10% auto; padding: 20px;
      width: 400px; border-radius: 10px; box-shadow: 0 0 15px #000;
    }
    .modal-content input, .modal-content select {
      width: 100%; padding: 8px; margin: 8px 0;
      border-radius: 5px; border: 1px solid #333; background-color: #2a2a2a; color: #f4f4f4;
    }
    .close-cross {
      position: absolute; top: 10px; right: 15px;
      font-size: 24px; cursor: pointer; color: #ff4d4d;
    }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; }
    th, td { border: 1px solid #333; padding: 8px; }
    th { background-color: #2a2a2a; }
    td { background-color: #1f1f1f; }
  </style>
</head>
<body>
  <header>
    <img src="https://tse1.mm.bing.net/th/id/OIP.y9Wm3U5yHBe2-nfaphxiPwHaHV?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo">
    <h1>Manage Bills</h1>
  </header>

  <main>
    <button class="action-btn" onclick="openModal('createModal')">Create Bill</button>
    <button class="action-btn" onclick="openModal('getModal')">Get Bill by ID</button>
    <button class="action-btn" onclick="getAllBills()">Get All Bills</button>
    <button class="action-btn" onclick="openModal('updateModal')">Update Bill</button>
    <button class="action-btn" onclick="openModal('patientBillsModal')">Get Bills by Patient</button>
    <button class="action-btn" onclick="getPendingBills()">Get Pending Bills</button>
  </main>

  <!-- Create Bill Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('createModal')">&times;</span>
      <h2>Create Bill</h2>

<input type="number" id="createPatientId" placeholder="Patient ID" required>

<input type="number" id="createAppointmentId" placeholder="Appointment ID (Optional)">

<input type="date" id="createBillDate" required>

<input type="number" id="createTotalAmount" placeholder="Total Amount" required>

<input type="number" id="createTaxAmount" placeholder="Tax Amount (Optional)">

<select id="createPaymentStatus" required>
  <option value="Pending">Pending</option>
  <option value="Paid">Paid</option>
  <option value="Overdue">Overdue</option>
  <option value="Cancelled">Cancelled</option>
</select>

<select id="createPaymentMethod">
  <option value="">-- Select Payment Method (Optional) --</option>
  <option value="Cash">Cash</option>
  <option value="Credit Card">Credit Card</option>
  <option value="Debit Card">Debit Card</option>
  <option value="Insurance">Insurance</option>
  <option value="Online">Online</option>
</select>

<input type="date" id="createPaymentDate" placeholder="Payment Date (Optional)">

<input type="text" id="createBillType" placeholder="Bill Type">

<button onclick="createBill()">Create</button>

    </div>
  </div>

  <!-- Get Bill Modal -->
  <div id="getModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('getModal')">&times;</span>
      <h2>Get Bill by ID</h2>
      <input type="number" id="getBillId" placeholder="Bill ID">
      <button onclick="getBillById()">Get</button>
      <div id="singleBill"></div>
    </div>
  </div>

  <!-- Update Bill Modal -->
  <div id="updateModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('updateModal')">&times;</span>
      <h2>Update Bill</h2>
      <input type="number" id="updateBillId" placeholder="Bill ID">
      <input type="number" id="updateTotalAmount" placeholder="Total Amount">
      <input type="number" id="updateTaxAmount" placeholder="Tax Amount">
      <select id="updatePaymentStatus">
        <option value="Pending">Pending</option>
        <option value="Paid">Paid</option>
      </select>
      <select id="updatePaymentMethod">
        <option value="">-- Select Payment Method (Optional) --</option>
        <option value="Cash">Cash</option>
        <option value="Credit Card">Credit Card</option>
        <option value="Debit Card">Debit Card</option>
        <option value="Insurance">Insurance</option>
        <option value="Online">Online</option>
        </select>

      <input type="date" id="updatePaymentDate">
      <input type="text" id="updateBillType" placeholder="Bill Type">
      <button onclick="updateBill()">Update</button>
    </div>
  </div>

  <!-- Bills by Patient Modal -->
  <div id="patientBillsModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('patientBillsModal')">&times;</span>
      <h2>Bills by Patient</h2>
      <input type="number" id="patientIdForBills" placeholder="Patient ID">
      <button onclick="getBillsByPatient()">Get Bills</button>
      <div id="billsByPatientList"></div>
    </div>
  </div>

  <!-- Bills Table -->
  <div id="billsList"></div>

  <script>
    const baseUrl = 'http://localhost:3001/api';

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function createBill() {
  const paymentMethod = document.getElementById('createPaymentMethod').value;
  const paymentDate = document.getElementById('createPaymentDate').value;
  const billDate = document.getElementById('createBillDate').value;

  // Validate payment_date >= bill_date
  if (paymentDate && paymentDate < billDate) {
    alert("Payment date cannot be earlier than bill date.");
    return;
  }

  const data = {
    patient_id: document.getElementById('createPatientId').value,
    appointment_id: document.getElementById('createAppointmentId').value || null,

    bill_date: billDate,
    total_amount: document.getElementById('createTotalAmount').value,

    tax_amount: document.getElementById('createTaxAmount').value || null,

    payment_status: document.getElementById('createPaymentStatus').value,

    payment_method: paymentMethod === "" ? null : paymentMethod,

    payment_date: paymentDate === "" ? null : paymentDate,

    bill_type: document.getElementById('createBillType').value || null
  };

  const res = await fetch(`${baseUrl}/billing`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    alert('Bill Created!');
    closeModal('createModal');
    getAllBills();
  } else {
    const d = await res.json();
    alert('Failed: ' + (d.message || 'Unknown error'));
  }
}


    async function getBillById() {
      const id = document.getElementById('getBillId').value;
      const res = await fetch(`${baseUrl}/billing/${id}`);
      const data = await res.json();
      const div = document.getElementById('singleBill');
      div.innerHTML = '';
      if(data.success){
        const b = data.data;
        div.innerHTML = `<table>
          <tr><th>Bill ID</th><td>${b[0]}</td></tr>
          <tr><th>Patient ID</th><td>${b[1]}</td></tr>
          <tr><th>Appointment ID</th><td>${b[2]}</td></tr>
          <tr><th>Bill Date</th><td>${b[4]}</td></tr>
          <tr><th>Total Amount</th><td>${b[5]}</td></tr>
          <tr><th>Tax Amount</th><td>${b[6]}</td></tr>
          <tr><th>Payment Status</th><td>${b[7]}</td></tr>
          <tr><th>Payment Method</th><td>${b[8]}</td></tr>
          <tr><th>Payment Date</th><td>${b[9]}</td></tr>
          <tr><th>Bill Type</th><td>${b[10]}</td></tr>
        </table>`;
      } else { div.textContent = data.message; }
    }

async function getAllBills() {
      const res = await fetch(`${baseUrl}/billing`);
      const data = await res.json();
      const list = document.getElementById('billsList');
      list.innerHTML = '';
      if(data.success){
        const table = document.createElement('table');
        table.innerHTML = `<tr>
          <th>Bill ID</th><th>Patient ID</th><th>Appointment ID</th><th>Bill Date</th><th>Total</th>
          <th>Tax</th><th>Status</th><th>Method</th><th>Payment Date</th><th>Type</th>
        </tr>`;
        data.data.forEach(b => {
          table.innerHTML += `<tr>
            <td>${b[0]}</td>
            <td>${b[1]}</td>
            <td>${b[2]}</td>
            <td>${b[3]}</td>
            <td>${b[4]}</td>
            <td>${b[5]}</td>
            <td>${b[6]}</td>
            <td>${b[7]}</td>
            <td>${b[8]}</td>
            <td>${b[9]}</td>
          </tr>`;
        });
        list.appendChild(table);
      }
    }


    async function updateBill() {
  const id = document.getElementById('updateBillId').value;

  const paymentMethod = document.getElementById('updatePaymentMethod').value;
  const paymentDate = document.getElementById('updatePaymentDate').value;

  // Convert optional fields to null
  const pm = paymentMethod === "" ? null : paymentMethod;
  const pd = paymentDate === "" ? null : paymentDate;

  // Build data object
  const data = {
    total_amount: document.getElementById('updateTotalAmount').value || null,
    tax_amount: document.getElementById('updateTaxAmount').value || null,
    payment_status: document.getElementById('updatePaymentStatus').value || null,
    payment_method: pm,
    payment_date: pd,
    bill_type: document.getElementById('updateBillType').value || null
  };

  const res = await fetch(`${baseUrl}/billing/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

  if (res.ok) {
    alert('Bill Updated');
    closeModal('updateModal');
    getAllBills();
  } else {
    const d = await res.json();
    alert('Failed: ' + (d.message || 'Unknown error'));
  }
}

async function getBillsByPatient() {
  const patientId = document.getElementById('patientIdForBills').value;
  const res = await fetch(`${baseUrl}/billing/patient/${patientId}`);
  const data = await res.json();
  const list = document.getElementById('billsList'); // use the same div as others
  list.innerHTML = '';

  if (data.success && data.data.length > 0) {
    const table = document.createElement('table');
    table.innerHTML = `<tr>
      <th>Bill ID</th><th>Patient ID</th><th>Appointment ID</th><th>Bill Date</th><th>Total</th>
      <th>Tax</th><th>Status</th><th>Method</th><th>Payment Date</th><th>Type</th>
    </tr>`;

    data.data.forEach(b => {
      table.innerHTML += `<tr>
        <td>${b[0]}</td>
        <td>${b[1]}</td>
        <td>${b[2]}</td>
        <td>${b[3]}</td>
        <td>${b[4]}</td>
        <td>${b[5]}</td>
        <td>${b[6]}</td>
        <td>${b[7]}</td>
        <td>${b[8]}</td>
        <td>${b[9]}</td>
      </tr>`;
    });

    list.appendChild(table);
    closeModal('patientBillsModal'); // close the modal to show in main page
  } else {
    list.textContent = 'No bills found for this patient.';
  }
}


    async function getPendingBills() {
      const res = await fetch(`${baseUrl}/billing/pending/all`);
      const data = await res.json();
      const list = document.getElementById('billsList');
      list.innerHTML = '';
      if(data.success && data.data.length > 0){
        const table = document.createElement('table');
        table.innerHTML = `<tr>
          <th>Bill ID</th><th>Patient ID</th><th>Appointment ID</th><th>Bill Date</th><th>Total</th>
          <th>Tax</th><th>Status</th><th>Method</th><th>Payment Date</th><th>Type</th>
        </tr>`;
        data.data.forEach(b => {
          table.innerHTML += `<tr>
            <td>${b[0]}</td>
            <td>${b[1]}</td>
            <td>${b[2]}</td>
            <td>${b[3]}</td>
            <td>${b[4]}</td>
            <td>${b[5]}</td>
            <td>${b[6]}</td>
            <td>${b[7]}</td>
            <td>${b[8]}</td>
            <td>${b[9]}</td>
            </tr>`;
        });
        list.appendChild(table);
      } else {
        list.textContent = 'No pending bills found.';
      }
    }

  </script>
</body>
</html>
