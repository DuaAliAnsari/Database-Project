<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Doctors</title>
  <style>
    body { background-color: #121212; color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; }
    header { display: flex; align-items: center; background-color: #1f1f1f; padding: 10px 20px; }
    header img { width: 50px; height: 50px; margin-right: 15px; }
    header h1 { margin: 0; }
    main { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 50px; }
    button.action-btn { padding: 15px 40px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background-color: #00bfa5; color: #fff; }
    button.action-btn:hover { background-color: #00a58f; }
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
    .modal-content { position: relative; background-color: #1f1f1f; margin: 10% auto; padding: 20px; width: 400px; border-radius: 10px; box-shadow: 0 0 15px #000; }
    .modal-content input, .modal-content select { width: 100%; padding: 8px; margin: 8px 0; border-radius: 5px; border: 1px solid #333; background-color: #2a2a2a; color: #f4f4f4; }
    .close-cross { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #ff4d4d; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; margin-left: auto; margin-right: auto; }
    th, td { border: 1px solid #333; padding: 8px; }
    th { background-color: #2a2a2a; }
    td { background-color: #1f1f1f; }
  </style>
</head>
<body>
  <header>
    <img src="https://tse1.mm.bing.net/th/id/OIP.y9Wm3U5yHBe2-nfaphxiPwHaHV?cb=ucfimg2&ucfimg=1&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo">
    <h1>Manage Doctors</h1>
  </header>

  <main>
    <button class="action-btn" onclick="openModal('createModal')">Create Doctor</button>
    <button class="action-btn" onclick="openModal('getModal')">Get Doctor by ID</button>
    <button class="action-btn" onclick="getAllDoctors()">Get All Doctors</button>
    <button class="action-btn" onclick="openModal('updateModal')">Update Doctor</button>
    <button class="action-btn" onclick="openModal('searchModal')">Search Doctors</button>
    <button class="action-btn" onclick="openModal('getApptModal')">Get Doctor Appointments</button>
  </main>

  <!-- Create Doctor Modal -->
  <div id="createModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('createModal')">&times;</span>
      <h2>Create Doctor</h2>
      <input type="text" id="createName" placeholder="Doctor Name">
      <input type="text" id="createDept" placeholder="Department">
      <input type="text" id="createPhone" placeholder="Phone Number">
      <input type="email" id="createEmail" placeholder="Email">
      <button onclick="createDoctor()">Create</button>
    </div>
  </div>

  <!-- Get Doctor Modal -->
  <div id="getModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('getModal')">&times;</span>
      <h2>Get Doctor by ID</h2>
      <input type="number" id="getId" placeholder="Doctor ID">
      <button onclick="getDoctorById()">Get</button>
      <div id="singleDoctor"></div>
    </div>
  </div>

  <!-- Update Doctor Modal -->
  <div id="updateModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('updateModal')">&times;</span>
      <h2>Update Doctor</h2>
      <input type="number" id="updateId" placeholder="Doctor ID">
      <input type="text" id="updateName" placeholder="Doctor Name">
      <input type="text" id="updateDept" placeholder="Department">
      <input type="text" id="updatePhone" placeholder="Phone Number">
      <input type="email" id="updateEmail" placeholder="Email">
      <button onclick="updateDoctor()">Update</button>
    </div>
  </div>

  <!-- Search Doctors Modal -->
  <div id="searchModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('searchModal')">&times;</span>
      <h2>Search Doctors</h2>
      <input type="text" id="searchName" placeholder="Enter Name">
      <button onclick="searchDoctors()">Search</button>
      <div id="searchResults"></div>
    </div>
  </div>

  <!-- Get Doctor Appointments Modal -->
  <div id="getApptModal" class="modal">
    <div class="modal-content">
      <span class="close-cross" onclick="closeModal('getApptModal')">&times;</span>
      <h2>Doctor Appointments</h2>
      <input type="number" id="doctorIdForAppointments" placeholder="Doctor ID">
      <button onclick="getDoctorAppointments()">Get Appointments</button>
      <div id="doctorAppointmentsList" style="margin-top: 15px;"></div>
    </div>
  </div>

  <!-- Doctors Table -->
  <div id="doctorsList"></div>

  <script>
    const baseUrl = 'http://localhost:3001/api';

    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- CRUD Functions ---
    async function createDoctor() {
      const doctor_name = document.getElementById('createName').value;
      const department = document.getElementById('createDept').value;
      const phone_number = document.getElementById('createPhone').value;
      const email = document.getElementById('createEmail').value;

      const res = await fetch(`${baseUrl}/doctors`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ doctor_name, department, phone_number, email })
      });

      if(res.ok){ alert('Doctor Created'); closeModal('createModal'); getAllDoctors(); }
      else{ const data = await res.json(); alert('Failed: '+(data.message||'Unknown error')); }
    }

    async function getDoctorById() {
      const id = document.getElementById('getId').value;
      const res = await fetch(`${baseUrl}/doctors/${id}`);
      const data = await res.json();
      const div = document.getElementById('singleDoctor');
      div.innerHTML = '';
      if(data.success){
        const d = data.data;
        div.innerHTML = `<table>
          <tr><th>ID</th><td>${d[0]}</td></tr>
          <tr><th>Name</th><td>${d[1]}</td></tr>
          <tr><th>Department</th><td>${d[2]}</td></tr>
          <tr><th>Phone</th><td>${d[3]}</td></tr>
          <tr><th>Email</th><td>${d[4]}</td></tr>
        </table>`;
      } else { div.textContent = data.message; }
    }

    async function getAllDoctors() {
      const res = await fetch(`${baseUrl}/doctors`);
      const data = await res.json();
      const list = document.getElementById('doctorsList');
      list.innerHTML = '';
      if(data.success){
        const table = document.createElement('table');
        table.innerHTML = `<tr>
          <th>ID</th><th>Name</th><th>Department</th><th>Phone</th><th>Email</th>
        </tr>`;
        data.data.forEach(d => {
          table.innerHTML += `<tr>
            <td>${d[0]}</td>
            <td>${d[1]}</td>
            <td>${d[2]}</td>
            <td>${d[3]}</td>
            <td>${d[4]}</td>
          </tr>`;
        });
        list.appendChild(table);
      }
    }

    async function updateDoctor() {
      const doctor_id = document.getElementById('updateId').value;
      const doctor_name = document.getElementById('updateName').value;
      const department = document.getElementById('updateDept').value;
      const phone_number = document.getElementById('updatePhone').value;
      const email = document.getElementById('updateEmail').value;

      const res = await fetch(`${baseUrl}/doctors/${doctor_id}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ doctor_name, department, phone_number, email })
      });

      if(res.ok){ alert('Doctor Updated'); closeModal('updateModal'); getAllDoctors(); }
      else{ const data = await res.json(); alert('Failed: '+(data.message||'Unknown error')); }
    }

    async function searchDoctors() {
      const query = document.getElementById('searchName').value.trim();
      if (!query) return alert('Enter a name to search');

      const res = await fetch(`${baseUrl}/doctors/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      const list = document.getElementById('doctorsList');
      list.innerHTML = '';

      if(data.success && data.data.length > 0){
        const table = document.createElement('table');
        table.innerHTML = `<tr>
          <th>ID</th><th>Name</th><th>Department</th><th>Phone</th><th>Email</th>
        </tr>`;
        data.data.forEach(d => {
          table.innerHTML += `<tr>
            <td>${d[0]}</td>
            <td>${d[1]}</td>
            <td>${d[2]}</td>
            <td>${d[3]}</td>
            <td>${d[4]}</td>
          </tr>`;
        });
        list.appendChild(table);
      } else { list.textContent = 'No doctors found'; }
    }

    async function getDoctorAppointments() {
  const doctorId = document.getElementById('doctorIdForAppointments').value;
  const res = await fetch(`${baseUrl}/doctors/${doctorId}/appointments`);
  const data = await res.json();
  const listDiv = document.getElementById('doctorAppointmentsList');
  listDiv.innerHTML = '';

  if (!data.success || data.data.length === 0) {
    listDiv.textContent = 'No appointments found for this doctor.';
    return;
  }

  // Create table in the same style as others
  const table = document.createElement('table');
  table.innerHTML = `<tr>
    <th>ID</th><th>Patient ID</th><th>Date</th><th>Time</th><th>Status</th><th>Patient Name</th>
  </tr>`;

  data.data.forEach(appt => {
    table.innerHTML += `<tr>
      <td>${appt[0]}</td>
      <td>${appt[1]}</td>
      <td>${appt[2].split('T')[0]}</td>
      <td>${appt[3]}</td>
      <td>${appt[4]}</td>
      <td>${appt[5]}</td>
    </tr>`;
  });

  listDiv.appendChild(table);
}

  </script>
</body>
</html>
