   async function getPatientById() {
  const id = document.getElementById('getId').value;
  const res = await fetch(`${baseUrl}/patients/${id}`);
  const data = await res.json();
  const div = document.getElementById('singlePatient');
  div.innerHTML = '';
  if(data.success){
    const p = data.data; // array
    div.innerHTML = `<table>
      <tr><th>ID</th><td>${p[0]}</td></tr>
      <tr><th>Name</th><td>${p[1]}</td></tr>
      <tr><th>Phone</th><td>${p[2]}</td></tr>
      <tr><th>DOB</th><td>${p[3]}</td></tr>
      <tr><th>Gender</th><td>${p[4]}</td></tr>
      <tr><th>Age</th><td>${p[5]}</td></tr>
    </table>`;
  } else { div.textContent = data.message; }
}


    async function getAllPatients() {
  const res = await fetch(`${baseUrl}/patients`);
  const data = await res.json();
  const list = document.getElementById('patientsList');
  list.innerHTML = '';
  if(data.success){
    const table = document.createElement('table');
    table.innerHTML = `<tr>
      <th>ID</th><th>Name</th><th>Phone</th><th>DOB</th><th>Gender</th><th>Age</th>
    </tr>`;
    data.data.forEach(p=>{
      table.innerHTML += `<tr>
        <td>${p[0]}</td>
        <td>${p[1]}</td>
        <td>${p[2]}</td>
        <td>${p[3]}</td>
        <td>${p[4]}</td>
        <td>${p[5]}</td>
      </tr>`;
    });
    list.appendChild(table);
  }
}

    async function searchPatients() {
  const query = document.getElementById('searchName').value.trim();
  if (!query) return alert('Enter a name to search');

  const res = await fetch(`${baseUrl}/patients/search?q=${encodeURIComponent(query)}`);
  const data = await res.json();
  const list = document.getElementById('patientsList');
  list.innerHTML = '';

  if(data.success && data.data.length > 0){
    const table = document.createElement('table');
    table.innerHTML = `<tr>
      <th>ID</th><th>Name</th><th>Phone</th><th>DOB</th><th>Gender</th><th>Age</th>
    </tr>`;

    data.data.forEach(p => {
      table.innerHTML += `<tr>
        <td>${p[0]}</td>
        <td>${p[1]}</td>
        <td>${p[2]}</td>
        <td>${p[3]}</td>
        <td>${p[4]}</td>
        <td>${p[5]}</td>
      </tr>`;
    });

    list.appendChild(table);
  } else {
    list.textContent = 'No patients found';
  }
}

async function getPatientAppointments() {
  const patientId = document.getElementById('patientIdForAppointments').value.trim();
  if (!patientId) return alert('Enter a patient ID');

  const res = await fetch(`${baseUrl}/patients/${patientId}/appointments`);
  const data = await res.json();
  const list = document.getElementById('patientsList'); // reuse the same div for table
  list.innerHTML = '';

  if (data.success && data.data.length > 0) {
    const table = document.createElement('table');
    table.innerHTML = `<tr>
      <th>ID</th>
      <th>Doctor ID</th>
      <th>Date</th>
      <th>Time</th>
      <th>Status</th>
      <th>Doctor Name</th>
      <th>Department</th>
    </tr>`;

    data.data.forEach(appt => {
      table.innerHTML += `<tr>
        <td>${appt[0]}</td>
        <td>${appt[1]}</td>
        <td>${appt[2].split('T')[0]}</td>
        <td>${appt[3]}</td>
        <td>${appt[4]}</td>
        <td>${appt[5]}</td>
        <td>${appt[6]}</td>
      </tr>`;
    });

    list.appendChild(table);
  } else {
    list.textContent = 'No appointments found for this patient';
  }
}
